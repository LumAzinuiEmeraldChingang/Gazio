<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Gas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightskyblue;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            background: white;
            padding: 25px;
            margin: 40px auto;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        .profile-section {
            text-align: center;
            margin-bottom: 25px;
        }

        #profilePreview {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ccc;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #555;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #gasPreview {
            display: block;
            margin: 15px auto;
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #ccc;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        button {
            width: 48%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .update {
            background-color: darkblue;
            color: white;
        }

        .cancel {
            background-color: red;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="profile-section">
        <img id="profilePreview" src="profile-default.png" alt="Profile Picture">
        <label>Change Profile Picture</label>
        <input type="file" accept="image/*" id="profileInput">
    </div>

    <h2>Edit Gas Information</h2>

    <img id="gasPreview" src="gas-default.png" alt="Gas Bottle">

    <label>Change Gas Image</label>
    <input type="file" accept="image/*" id="gasInput">

    <label>Name</label>
    <input type="text" id="name" value="John Doe">

    <label>Phone Number</label>
    <input type="tel" id="phone" placeholder="Enter phone number">

    <label>Gas Brand</label>
    <select id="brand">
        <option>Neptune</option>
        <option>Olibya</option>
        <option>Green Oil</option>
        <option>Total</option>
        <option>Tradex</option>
        <option>Camgas</option>
    </select>

    <label>Quantity (kg)</label>
    <input type="number" id="quantity" value="12">

    <label>Price (FCFA)</label>
    <input type="number" id="price" value="6500">

    <div class="buttons">
        <button class="update" id="updateBtn">Update</button>
        <button class="cancel" id="cancelBtn">Cancel</button>
    </div>

</div>

<script>
    const profileInput = document.getElementById("profileInput");
    const profilePreview = document.getElementById("profilePreview");

    const gasInput = document.getElementById("gasInput");
    const gasPreview = document.getElementById("gasPreview");

    const updateBtn = document.getElementById("updateBtn");
    const cancelBtn = document.getElementById("cancelBtn");

    profileInput.addEventListener("change", function () {
        const file = this.files[0];
        if (file) {
            profilePreview.src = URL.createObjectURL(file);
        }
    });

    gasInput.addEventListener("change", function () {
        const file = this.files[0];
        if (file) {
            gasPreview.src = URL.createObjectURL(file);
        }
    });

    updateBtn.addEventListener("click", function () {
        const phone = document.getElementById("phone").value;

        if (phone === "") {
            alert("Please enter a phone number.");
            return;
        }

        alert("Gas details updated successfully.");
    });

    cancelBtn.addEventListener("click", function () {
        location.reload();
    });
</script>

</body>
</html>
