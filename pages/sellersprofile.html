<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile with Gas Grid</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, Helvetica, sans-serif;
}

html, body {
  overflow-x: hidden;
}

body {
  background: linear-gradient(135deg, #1697ec, #4dc9f7);
  min-height: 100vh;
}

.back-arrow {
  position: fixed;
  top: 12px;
  left: 12px;
  font-size: 26px;
  color: #fff;
  text-decoration: none;
  z-index: 9999;
}
.wrapper {
  max-width: 1250px;
  margin: 50px auto;
  width: 100%;
  padding: 0 10px;
}

.top-section {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 30px;
}

.profile-left {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: 3px solid #1e40af;
  background-color: #cbd5e1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #64748b;
  font-size: 12px;
  text-align: center;
}

.gas-section h2 {
  margin-bottom: 10px;
  color: #1e293b;
}

.gas-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr); /* 3 columns always */
  gap: 10px;
}

.gas-card {
  display: flex;
  flex-direction: row;
  border: 3px solid #1e293b;
  background: #f8fafc;
  width: 100%;
  min-width: 0; /* important to prevent overflow */
}

.gas-left {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 6px;
  background-color: #e2e8f0;
}

.gas-image {
  width: 100%;
  max-width: 80px;
  aspect-ratio: 1/1;
  background-color: #cbd5e1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: #64748b;
  margin-bottom: 6px;
}

.qty-box {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin-bottom: 6px;
}
.qty-box button {
  width: 26px;
  height: 26px;
  font-size: 16px;
  cursor: pointer;
}
.qty-box input {
  width: 42px;
  height: 26px;
  text-align: center;
}
.reserve-btn {
  background: #22c55e;
  color: #fff;
  border: none;
  padding: 6px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  width: 100%;
}
.reserve-btn:hover {
  background: #16a34a;
}
.reserve-btn:disabled {
  background: #94a3b8;
  cursor: not-allowed;
  opacity: 0.8;
}
.gas-right {
  display: flex;
  flex-direction: column;
  justify-content: space-between; /* push available text to bottom */
  padding: 6px;
  flex: 1;
  gap: 4px;
  min-width: 0; /* important to prevent overflow */
}
.gas-right div:not(.available-text) {
  background: #e2e8f0;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  color: #64748b;
  font-size: 10px;
  padding: 2px 4px;
}
.available-text {
  color: #16a34a; /* green text */
  font-weight: bold;
  font-size: 12px;
  margin-top: auto; /* push to bottom */
  text-align: left;
  background: none;
}
/* Available box */
.available-box { }
/* Make grid fit all devices without horizontal scroll */
@media (max-width: 1250px) {
  .gas-card {
    flex-direction: column; /* stack left/right on very narrow screens */
  }
}
</style>
</head>
<body>
<a href="javascript:history.back()" class="back-arrow">&#8592;</a>
<div class="wrapper">
  <div class="top-section">
    <div class="profile-left">Profile</div>
    <div style="flex:1;">
      <div id="seller-username" style="width:150px; height:20px; background:#e2e8f0; margin-bottom:4px; display:flex; align-items:center; justify-content:center; color:#64748b; font-size:10px;">Username</div>
      <div id="seller-location" style="width:100px; height:16px; background:#e2e8f0; margin-bottom:4px; display:flex; align-items:center; justify-content:center; color:#64748b; font-size:9px;">Location</div>
      <div id="seller-phone" style="width:120px; height:16px; background:#e2e8f0; display:flex; align-items:center; justify-content:center; color:#64748b; font-size:9px;">Phone</div>
    </div>
  </div>
  <div class="gas-section">
    <h2>Available Gas Bottles</h2>
    <!-- available box removed -->
    <div id="gas-grid" class="gas-grid">
      <!-- cards will be populated from /profile-data -->
    </div>
  </div>
</div>
<script>
document.addEventListener("click", function (e) {
  // Plus button
  if (e.target.textContent === "+") {
    const input = e.target.previousElementSibling;
    if (!input) return;
    const min = parseInt(input.min) || 1;
    const max = parseInt(input.max);
    const current = parseInt(input.value || min);
    if (!Number.isNaN(max)) {
      if (current < max) input.value = current + 1;
      else input.value = max;
    } else {
      input.value = current + 1;
    }
  }
  // Minus button
  if (e.target.textContent === "-") {
    const input = e.target.nextElementSibling;
    if (!input) return;
    const min = parseInt(input.min) || 1;
    const current = parseInt(input.value || min);
    if (current > min) {
      input.value = current - 1;
    } else {
      input.value = min;
    }
  }
});

// clamp manual numeric input to min/max
document.addEventListener('input', function (e) {
  const el = e.target;
  if (el && el.matches && el.matches('input[type="number"]')) {
    const min = parseInt(el.min) || 1;
    const max = parseInt(el.max);
    let val = parseInt(el.value || min);
    if (Number.isNaN(val)) val = min;
    if (!Number.isNaN(max)) val = Math.max(min, Math.min(max, val));
    else val = Math.max(min, val);
    if (String(el.value) !== String(val)) el.value = val;
  }
});
</script>

<script>
// populate seller info and gas grid from /profile-data
document.addEventListener('DOMContentLoaded', function () {
  const usernameEl = document.getElementById('seller-username');
  const locationEl = document.getElementById('seller-location');
  const phoneEl = document.getElementById('seller-phone');
  const grid = document.getElementById('gas-grid');

  // if URL contains ?user=<username> request that user's data, otherwise use default /profile-data
  const params = new URLSearchParams(window.location.search);
  const viewUser = params.get('user');
  const endpoint = viewUser ? `/profile-data?user=${encodeURIComponent(viewUser)}` : '/profile-data';
  fetch(endpoint).then(r => r.json()).then(data => {
    if (!data) return;
    if (data.name && usernameEl) usernameEl.textContent = data.name;
    // profile image - support URL, data URL, base64, or object ({contentType,data} or {url})
    const profileLeft = document.querySelector('.profile-left');
    if (profileLeft) {
      profileLeft.innerHTML = '';
      const img = document.createElement('img');
      img.alt = 'Profile';
      img.style.width = '100%';
      img.style.height = '100%';
      img.style.objectFit = 'cover';
      img.style.borderRadius = '50%';

      function showInitials() {
        const initials = (data.name ? data.name.split(' ').map(s => s[0]).slice(0,2).join('') : 'P').toUpperCase();
        const span = document.createElement('div');
        span.textContent = initials;
        span.style.width = '100%';
        span.style.height = '100%';
        span.style.display = 'flex';
        span.style.alignItems = 'center';
        span.style.justifyContent = 'center';
        span.style.fontSize = '24px';
        span.style.color = '#64748b';
        profileLeft.appendChild(span);
      }

      if (data.profileImage) {
        let src = '';
        if (typeof data.profileImage === 'object') {
          const contentType = data.profileImage.contentType || data.profileImage.mimetype || data.profileImage.mime || data.profileImage.type;
          const b64 = data.profileImage.data || data.profileImage.base64 || data.profileImage.b64;
          if (b64 && contentType) {
            src = `data:${contentType};base64,${b64}`;
          } else if (typeof data.profileImage.url === 'string') {
            src = data.profileImage.url;
          }
        } else if (typeof data.profileImage === 'string') {
          if (data.profileImage.startsWith('data:') || data.profileImage.startsWith('http') || data.profileImage.startsWith('/')) {
            src = data.profileImage;
          } else {
            const isBase64 = /^[A-Za-z0-9+/=\s]+$/.test(data.profileImage);
            if (isBase64) {
              src = `data:image/png;base64,${data.profileImage}`;
            } else {
              src = data.profileImage;
            }
          }
        }

        if (src) {
          img.src = src;
          img.addEventListener('error', function () {
            profileLeft.removeChild(img);
            showInitials();
          });
          profileLeft.appendChild(img);
        } else {
          showInitials();
        }
      } else {
        showInitials();
      }
    }

    // Use explicit profile fields when available, otherwise fall back to bottles
    if (locationEl) locationEl.textContent = data.location || (data.bottles && data.bottles[0] && data.bottles[0].phone ? 'Location' : 'Location');
    if (phoneEl) phoneEl.textContent = 'Phone: ' + (data.phone || (data.bottles && data.bottles[0] && data.bottles[0].phone) || '');
    if (data.bottles && data.bottles.length) {
      // phone already set above
      // create card for each bottle up to 9
      const bottles = data.bottles.slice(0, 9);
        // available box removed; no additional UI here
      grid.innerHTML = bottles.map(b => {
        const brand = (b.brand||'').replace(/</g,'&lt;');
        const rawBrand = (b.brand||'').replace(/"/g,'&quot;');
        const qty = b.quantity != null ? b.quantity : 0;
        const price = b.price != null ? b.price : 0;
        const available = qty > 0 ? 'Available' : 'Out of stock';
        const sellerName = (viewUser && viewUser.length) ? viewUser : (data.name || '');
        return `
          <div class="gas-card" data-available="${qty}" data-seller="${sellerName}">
            <div class="gas-left">
              <div class="gas-image"><img data-brand="${rawBrand}" src="images/gas-placeholder.png" alt="${brand}" style="width:100%;height:100%;object-fit:cover;border-radius:4px"></div>
              <div class="qty-box">
                <button class="qty-minus">-</button>
                <input type="number" value="1" min="1" max="${qty}">
                <button class="qty-plus">+</button>
              </div>
              <button class="reserve-btn" ${qty > 0 ? '' : 'disabled'}>Reserve</button>
            </div>
            <div class="gas-right">
              <div>Gas Name: ${brand}</div>
              <div>Quantity: ${qty}</div>
              <div>Price: ${price} CFA</div>
              <div class="available-text">${available}</div>
            </div>
          </div>`;
      }).join('\n');

      // load brand-specific images for the grid
      (function loadSellerImages(){
        const placeholdersrc = 'images/gas-placeholder.png';
        const exts = ['.jpeg', '.jpg', '.png'];
        function variants(name){
          if(!name) return [];
          const v = [];
          const cleaned = name.trim();
          const words = cleaned.split(/\s+/);
          v.push(cleaned);
          v.push(words.join(''));
          v.push(cleaned.toLowerCase());
          v.push(words.join('').toLowerCase());
          v.push(words.map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(''));
          return Array.from(new Set(v)).filter(Boolean);
        }

        document.querySelectorAll('.gas-image img[data-brand]').forEach(img => {
          const brand = img.getAttribute('data-brand') || '';
          const tries = [];
          variants(brand).forEach(base => exts.forEach(ext => tries.push('images/' + base + ext)));
          let i = 0;
          function tryNext(){
            if(i >= tries.length){ img.src = placeholdersrc; return; }
            const candidate = tries[i++];
            const tester = new Image();
            tester.onload = function(){ img.src = candidate; };
            tester.onerror = tryNext;
            tester.src = candidate;
          }
          tryNext();
        });
      })();
    } else {
      // no bottles: clear grid
      grid.innerHTML = '';
    }
  }).catch(err => {
    console.error('profile-data error', err);
  });
});
</script>

<script>
// Listen for inventory updates from other tabs (via localStorage)
window.addEventListener('storage', function (ev) {
  if (ev.key !== 'inventory-update') return;
  try {
    const payload = JSON.parse(ev.newValue || '{}');
    if (!payload || !payload.brand) return;
    const seller = payload.seller || '';
    const brand = String(payload.brand || '').toLowerCase();
    const delta = Number(payload.delta) || 0;
    // update matching cards: adjust data-available, Quantity text, available-text and controls
    document.querySelectorAll('.gas-card').forEach(card => {
      const sellerAttr = card.getAttribute('data-seller') || '';
      const nameDiv = card.querySelector('.gas-right div');
      const cardBrand = nameDiv ? String(nameDiv.textContent || '').replace(/^\s*Gas Name:\s*/i,'').trim().toLowerCase() : '';
      if (cardBrand === brand && (sellerAttr === '' || sellerAttr === seller)) {
        const prevAvailable = parseInt(card.getAttribute('data-available') || '0', 10) || 0;
        const updated = Math.max(0, prevAvailable + delta);
        card.setAttribute('data-available', String(updated));

        // update the Quantity display (second div inside .gas-right)
        const qtyDiv = card.querySelector('.gas-right div:nth-child(2)');
        if (qtyDiv) qtyDiv.textContent = 'Quantity: ' + updated;

        // update the visible status text
        const statusEl = card.querySelector('.available-text');
        if (statusEl) statusEl.textContent = updated > 0 ? 'Available' : 'Out of stock';

        // update reserve button disabled state
        const reserveBtn = card.querySelector('.reserve-btn');
        if (reserveBtn) reserveBtn.disabled = updated <= 0;

        // update numeric input constraints
        const input = card.querySelector('input[type="number"]');
        if (input) {
          input.max = String(Math.max(1, updated));
          if (parseInt(input.value || '1', 10) > updated) input.value = String(Math.max(1, updated));
        }
      }
    });
  } catch (e) { console.error('inventory-update storage handler error', e); }
});
</script>

<script>
// Reserve button handler: save reservation to localStorage and notify user
document.addEventListener('DOMContentLoaded', function () {
  const grid = document.getElementById('gas-grid');
  if (!grid) return;

  grid.addEventListener('click', function (ev) {
    const btn = ev.target.closest('.reserve-btn');
    if (!btn) return;
    const card = btn.closest('.gas-card');
    if (!card) return;

    // Get brand (from gas-right first div like 'Gas Name: BRAND')
    const gasRight = card.querySelector('.gas-right');
    let brand = '';
    if (gasRight) {
      const firstDiv = gasRight.querySelector('div');
      if (firstDiv) brand = firstDiv.textContent.replace(/^\s*Gas Name:\s*/i, '').trim();
    }

    const qtyInput = card.querySelector('input[type="number"]');
    const qty = qtyInput ? parseInt(qtyInput.value || '1', 10) : 1;
    const available = parseInt(card.getAttribute('data-available') || '0', 10);
    if (!Number.isNaN(available) && qty > available) {
      try { alert(`Cannot reserve ${qty} — only ${available} in stock`); } catch(e){}
      // clamp the input to available
      if (qtyInput) qtyInput.value = Math.max(1, available);
      return;
    }

    // try to read the price from the gas-right area (expects 'Price: X CFA')
    let price = '';
    if (gasRight) {
      const nodes = Array.from(gasRight.querySelectorAll('div'));
      for (const n of nodes) {
        const t = n.textContent || '';
        const m = t.match(/Price:\s*([0-9,.]+)/i);
        if (m) { price = m[1].replace(/,/g,''); break; }
      }
    }

    const seller = card.getAttribute('data-seller') || '';
    const reservation = {
      id: 'res-' + Date.now(),
      seller: seller,
      brand: brand || 'Unknown',
      qty: qty || 1,         // quantity reserved
      price: price || 0,    // price per bottle
      reservedAt: Date.now(),
      // reservation expiry: 5 hours from reservation
      expiresAt: Date.now() + 5 * 60 * 60 * 1000
    };

    // disable button to prevent duplicate clicks while we update server
    btn.disabled = true;

    // send decrement request to server so inventory is reduced at reservation time
    fetch('/decrement-bottle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ seller: reservation.seller, brand: reservation.brand, qty: reservation.qty })
    }).then(async res => {
      if (!res.ok) {
        const body = await res.json().catch(()=>({}));
        throw new Error(body && body.error ? body.error : 'Failed to decrement on server');
      }

      // update card UI to reflect new available quantity
      const prevAvailable = parseInt(card.getAttribute('data-available') || '0', 10) || 0;
      const newAvailable = Math.max(0, prevAvailable - reservation.qty);
      card.setAttribute('data-available', String(newAvailable));
      const qtyDisplay = card.querySelector('.gas-right div:nth-child(2)'); // 'Quantity: X'
      if (qtyDisplay) {
        qtyDisplay.textContent = 'Quantity: ' + newAvailable;
      }
      const availText = card.querySelector('.available-text');
      if (availText) availText.textContent = newAvailable > 0 ? 'Available' : 'Out of stock';
      // disable reserve button if no stock left
      if (newAvailable <= 0) {
        btn.disabled = true;
      }

      // persist reservation locally as pending
      try {
        const raw = localStorage.getItem('reservations');
        const list = raw ? JSON.parse(raw) : [];
        list.push(reservation);
        localStorage.setItem('reservations', JSON.stringify(list));
      } catch (e) { console.error('Unable to save reservation', e); }

      // notify other tabs/pages to decrement inventory (delta negative)
      try {
        const payload = { seller: reservation.seller, brand: reservation.brand, delta: -Number(reservation.qty), ts: Date.now() };
        localStorage.setItem('inventory-update', JSON.stringify(payload));
      } catch (e) {}

      try { alert(`You have reserved ${reservation.qty} x ${reservation.brand}`); } catch(e) {}
      // leave button disabled briefly so user sees the reservation state
      setTimeout(() => { if (card && newAvailable > 0) btn.disabled = false; }, 1500);
    }).catch(err => {
      console.error('Reserve/decrement error', err);
      try { alert('Unable to reserve: ' + (err && err.message ? err.message : 'server error')); } catch(e){}
      // re-enable button so the user can try again
      btn.disabled = false;
    });
  });
});
</script>

</body>
</html>
