<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign-up Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: lightskyblue;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .container {
    background-color: #fff;
    padding: 20px;
    border-radius: 5px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    width: 400px;
  }

  h2 {
    text-align: center;
    margin-bottom: 20px;
  }

  .form-group {
    margin-bottom: 15px;
  }

  label {
    display: block;
    margin-bottom: 5px;
  }

  input[type="text"],
  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 5px;
  }

  .signup-btn {
    width: 100%;
    padding: 10px;
    background-color: darkcyan;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }

  .signup-btn:hover {
    background-color: darkblue;
  }
</style>

<body>
  <div class="container">
    <h2>Sign-up</h2>
    <form method="POST" action="/signup">
      <div class="form-group">
        <label for="signup-username">Username:</label>
        <input type="text" id="signup-username" name="username" required>
      </div>
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="signup-password">Password:</label>
        <input type="password" id="signup-password" name="password" required>
      </div>
      <div class="form-group">
        <label for="confirm-password">Confirm Password:</label>
            <input type="password" id="confirm-password" name="confirm-password" required>
            <div id="confirm-error" class="error-msg" style="display:none; color:#b00020; font-size:12px; margin-top:6px;"></div>
      </div>
      <button type="submit" class="signup-btn">Sign up</button>
    </form>
        <script>
          (function () {
            const form = document.querySelector('form');
            const pwd = document.getElementById('signup-password');
            const confirm = document.getElementById('confirm-password');
            const err = document.getElementById('confirm-error');

            function showError(msg) {
              err.textContent = msg;
              err.style.display = 'block';
            }
            function hideError() {
              err.textContent = '';
              err.style.display = 'none';
            }

            form.addEventListener('submit', function (e) {
              if (!pwd || !confirm) return; // safety
              if (pwd.value !== confirm.value) {
                e.preventDefault();
                showError('Passwords do not match');
                confirm.focus();
                return false;
              }
              hideError();
            });

            // live feedback: hide error when user corrects
            confirm.addEventListener('input', function () {
              if (pwd.value === confirm.value) hideError();
            });
            pwd.addEventListener('input', function () {
              if (pwd.value === confirm.value) hideError();
            });
          })();
        </script>
    <p style="text-align: center; margin-top: 15px;">If you already have an account, <a href="Login.html" style="color: darkcyan;">login</a></p>
  </div>
</body>
</html>
