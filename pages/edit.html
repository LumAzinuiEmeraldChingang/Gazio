<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Gas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<style>
/* GENERAL PAGE */
body {
    font-family: Arial, sans-serif;
    background-color: lightskyblue;
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* MAIN CONTAINER */
.container {
    max-width: 650px;
    width: 100%;
    background: white;
    padding: 25px;
    margin: 0 auto;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0,0,0,0.1);
}

/* PROFILE SECTION */
.profile-section {
    text-align: center;
    margin-bottom: 25px;
}

#profilePreview {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #ccc;
    margin-bottom: 10px;
}

/* TITLE */
h2 {
    text-align: center;
    color: #333;
}

/* LABELS */
label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
    color: #555;
}

/* INPUTS */
input, select {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

/* GAS IMAGE */
#gasPreview {
    display: block;
    margin: 15px auto;
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid #ccc;
}

/* BUTTONS */
.buttons {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
}

/* UPDATE */
button.update {
    background-color: darkblue;
    color: white;
}

/* CANCEL */
button.cancel {
    background-color: red;
    color: white;
}
</style>
<body>

<div class="container">

    <!-- PROFILE SECTION (removed) -->

    <h2>Edit Gas Information</h2>

    <label>Gas Brand</label>
    <select id="brand">
        <option>Neptune</option>
        <option>Olibya</option>
        <option>Green Oil</option>
        <option>Total</option>
        <option>Tradex</option>
        <option>Camgas</option>
    </select>

    <label>Quantity (kg)</label>
    <input type="number" id="quantity" value="12">

    <label>Price (FCFA)</label>
    <input type="number" id="price" value="6500">

    <!-- phone removed -->
    <div class="buttons">
        <button class="update" id="updateBtn">Update</button>
        <button class="update" id="addBtn" style="background-color:green;">Add</button>
        <button class="cancel" id="cancelBtn">Cancel</button>
    </div>

</div>

<script>// PROFILE IMAGE (removed)
// GAS IMAGE (optional elements)
const gasInput = document.getElementById("gasInput");
const gasPreview = document.getElementById("gasPreview");

// PHONE removed
const brandSelect = document.getElementById('brand');
let existingBrands = new Set();
let fetchedBottles = {}; // map lowercase brand -> bottle data
let brandNote;

// BUTTONS
const updateBtn = document.getElementById("updateBtn");
const addBtn = document.getElementById("addBtn");
const cancelBtn = document.getElementById("cancelBtn");

// Profile image preview removed

// Gas image preview
if (gasInput && gasPreview) {
    gasInput.addEventListener("change", function () {
        const file = this.files[0];
        if (file) {
            gasPreview.src = URL.createObjectURL(file);
        }
    });
}

// normalizeCameroonNumber removed

// Update button
updateBtn.addEventListener("click", function () {
    // Update an existing bottle: require that the brand already exists for this user
    const brand = (document.getElementById('brand').value || '').trim();
    if (!brand) { alert('Please select a brand to update.'); return; }
    if (!existingBrands.has(brand.toLowerCase())) {
        alert("Gaz doesn't exist");
        return;
    }

    const payload = {
        brand,
        quantity: parseInt(document.getElementById('quantity').value, 10) || null,
        price: parseInt(document.getElementById('price').value, 10) || null
    };

    fetch('/update-bottle', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    }).then(async r => {
        const body = await r.json().catch(()=>({}));
        if (!r.ok) {
            const msg = body && body.error ? body.error : 'Update failed';
            alert(msg);
            return;
        }
        alert('Updated successfully');
        window.location.href = 'profile.html';
    }).catch(err => {
        console.error(err);
        alert('Failed to update. See console for details.');
    });
});

// Add button: create a new bottle for the signed-in user
if (addBtn) {
    addBtn.addEventListener('click', function() {
        const payload = {
            brand: (document.getElementById('brand').value || '').trim(),
            quantity: parseInt(document.getElementById('quantity').value, 10) || null,
            price: parseInt(document.getElementById('price').value, 10) || null
        };

        if (!payload.brand) { alert('Please select or enter a brand.'); return; }
        // If brand already exists, do not call server and show popup
        if (existingBrands.has(payload.brand.toLowerCase())) {
            alert('Gaz already exist');
            return;
        }

        fetch('/add-bottle', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(async r => {
            const txt = await r.json().catch(()=>({}));
            if (!r.ok) {
                const msg = txt && txt.error ? txt.error : 'Failed to add bottle';
                alert(msg);
                return;
            }
            // Show success and add a live preview on the edit page
            alert('Gaz bottle successfully added');
            renderAddedBottle(payload);
            // mark brand as existing and store fetched data
            if (payload.brand) {
                existingBrands.add(payload.brand.toLowerCase());
                fetchedBottles[payload.brand.toLowerCase()] = payload;
                // after adding, enable Update for that brand
                updateBtn.disabled = false;
            }
        }).catch(err => {
            console.error(err);
            alert('Failed to add bottle. See console for details.');
        });
    });
}

function renderAddedBottle(bottle) {
    const containerId = 'added-bottles';
    let container = document.getElementById(containerId);
    if (!container) {
        container = document.createElement('div');
        container.id = containerId;
        container.style.marginTop = '16px';
        container.style.padding = '10px';
        container.style.border = '1px solid #cfc';
        container.style.background = '#f6fff6';
        container.style.borderRadius = '6px';
        const heading = document.createElement('div');
        heading.textContent = 'Recently added bottle:';
        heading.style.fontWeight = 'bold';
        heading.style.marginBottom = '8px';
        container.appendChild(heading);
        document.querySelector('.container').appendChild(container);
    }

    const card = document.createElement('div');
    card.style.display = 'flex';
    card.style.justifyContent = 'space-between';
    card.style.alignItems = 'center';
    card.style.padding = '8px';
    card.style.borderTop = '1px solid #dfe';

    const info = document.createElement('div');
    info.innerHTML = `<strong>${escapeHtml(bottle.brand)}</strong> — ${bottle.quantity || 0} kg — ${bottle.price || 0} CFA`;

    const goto = document.createElement('button');
    goto.textContent = 'View profile';
    goto.style.background = '#5bbcd6';
    goto.style.color = 'white';
    goto.style.border = 'none';
    goto.style.padding = '6px 10px';
    goto.style.borderRadius = '4px';
    goto.style.cursor = 'pointer';
    goto.addEventListener('click', () => { window.location.href = 'profile.html'; });

    card.appendChild(info);
    card.appendChild(goto);
    container.appendChild(card);
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>"'`]/g, function (c) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;',"`":'&#96;'}[c];
    });
}

document.addEventListener('DOMContentLoaded', () => {
    if (!brandSelect) return;
    // fetch existing bottles and keep them in memory (don't disable options)
    fetch('/profile-data').then(r => r.json()).then(data => {
        if (!data || !data.bottles) return;
        data.bottles.forEach(b => {
            if (b.brand) {
                existingBrands.add(b.brand.toLowerCase());
                fetchedBottles[b.brand.toLowerCase()] = b;
            }
        });
        // set initial button states based on current selection
        const cur = (brandSelect.value || '').toLowerCase();
        if (cur && existingBrands.has(cur)) {
            addBtn.disabled = false; // Add allowed but will warn if duplicate
            // allow update
            updateBtn.disabled = false;
            // fill fields for the selected existing bottle
            const b = fetchedBottles[cur];
            if (b) {
                document.getElementById('quantity').value = b.quantity || 0;
                document.getElementById('price').value = b.price || 0;
            }
        } else {
            // new brand selected
            addBtn.disabled = false;
            updateBtn.disabled = true;
        }
    }).catch(() => {});

    // add a small note under brand select
    brandNote = document.createElement('small');
    brandNote.style.color = 'red';
    brandNote.style.display = 'none';
    brandSelect.parentNode.insertBefore(brandNote, brandSelect.nextSibling);

    brandSelect.addEventListener('change', () => {
        const val = (brandSelect.value || '').toLowerCase();
        if (!val) { addBtn.disabled = false; updateBtn.disabled = true; brandNote.style.display = 'none'; return; }
        if (existingBrands.has(val)) {
            // existing brand: enable Update, disable Add from modifying DB (Add will warn)
            updateBtn.disabled = false;
            addBtn.disabled = false; // keep Add enabled but will show warning
            brandNote.textContent = 'This brand already exists in your bottles.';
            brandNote.style.display = 'block';
            // populate fields with existing values
            const b = fetchedBottles[val];
            if (b) {
                document.getElementById('quantity').value = b.quantity || 0;
                document.getElementById('price').value = b.price || 0;
            }
        } else {
            // new brand: enable Add, disable Update
            addBtn.disabled = false;
            updateBtn.disabled = true;
            brandNote.style.display = 'none';
            // reset fields to defaults
            document.getElementById('quantity').value = 12;
            document.getElementById('price').value = 6500;
        }
    });
});

// Cancel button
cancelBtn.addEventListener("click", function () {
    window.location.href = "profile.html";
});
</script>
</body>
</html>
