<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gas Profile - {{username}}</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/* ===== GLOBAL ===== */
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1697ec, #4dc9f7);
    padding-bottom: 60px; /* reserve space for bottom dashboard */
}

/* ===== HEADER ===== */
.header {
    position: sticky;
    top: 0;
    background: linear-gradient(135deg, #1697ec, #4dc9f7);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    z-index: 10;
}
.icon {
    font-size: 24px;
    cursor: pointer;
    user-select: none;
    color: black;
}

/* ===== PROFILE ===== */
.profile {
    text-align: center;
    margin-top: 10px;
}
.avatar {
    width: 28vw;
    max-width: 120px;
    height: 28vw;
    max-height: 120px;
    border-radius: 50%;
    background-color: #ddd;
    margin: auto;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
.username {
    font-size: 1.4rem;
    font-weight: bold;
    margin-top: 8px;
}
.edit-btn {
    margin-top: 6px;
    padding: 5px 20px;
    background-color: #5bbcd6;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

/* ===== DASHBOARD TABS ===== */
.dashboard-tabs {
    display: flex;
    margin: 15px;
    background: white;
    border-radius: 10px;
    overflow: hidden;
}
.dash-tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    font-weight: bold;
    cursor: pointer;
    background: #f2f2f2;
}
.dash-tab.active {
    background: #5bbcd6;
    color: white;
}

/* ===== GAS CARD ===== */
.gas-card {
    background-color: white;
    border-radius: 14px;
    padding: 12px;
    margin: 15px;
    display: flex;
    gap: 12px;
    width: calc(100% - 30px);
}

/* ===== GAS BOTTLE ===== */
.gas-bottle {
    width: 22vw;
    max-width: 95px;
    height: 34vw;
    max-height: 150px;
    border-radius: 22px 22px 14px 14px;
    position: relative;
    color: white;
    font-weight: bold;
    text-align: center;
    flex-shrink: 0;
    overflow: hidden;
}
.gas-bottle::before {
    content: "";
    width: 40%;
    height: 10%;
    background-color: #444;
    position: absolute;
    top: -10%;
    left: 30%;
    border-radius: 4px;
    z-index: 2;
}
.gas-bottle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    top: 0;
    left: 0;
}
.gas-name {
    position: absolute;
    bottom: 10%;
    width: 100%;
    font-size: 0.8rem;
    z-index: 3;
}

/* ===== BRAND COLORS ===== */
.gaz { background-color: #1c3b68; }

/* ===== INFO BOXES ===== */
.details {
    flex: 1;
    display: grid;
    gap: 6px;
}
.info-box {
    background-color: #f2f2f2;
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 0.85rem;
    position: relative;
}
.price-box {
    font-weight: bold;
}
.stock {
    color: rgb(44, 93, 190);
}
.out {
    color: red;
}

/* ===== TIMER ===== */
.tx-timer {
    font-weight: bold;
    color: #1c3b68;
    margin-left: 6px;
}

/* ===== BOTTOM DASHBOARD ===== */
.bottom-dashboard {
 position: fixed;
    bottom: 0;
    width: 100%;
    background-color: white;
    display: flex;
    justify-content: space-around;
    padding: 8px 0;
    border-top: 1px solid #ccc;
}

.dash-icon {
    text-align: center;
    font-size: 12px;
    color: #666;
    cursor: pointer;
}

.dash-icon i {
    font-size: 22px;
}
</style>
</head>

<body>

<!-- ===== HEADER ===== -->
<div class="header">
    <a href="javascript:history.back()" class="icon">←</a>
    <a href="setting.html" class="icon">⚙</a>
</div>

<!-- ===== PROFILE ===== -->
<div class="profile">
    <div class="avatar"></div>
    <div id="username" class="username">{{username}}</div>
    <a href="edit.html" class="edit-btn">Edit</a>
</div>

<!-- ===== DASHBOARD TABS ===== -->
<div class="dashboard-tabs">
    <div class="dash-tab active" onclick="showPosts()">Posts</div>
    <div class="dash-tab" onclick="showTransactions()">Transactions</div>
</div>

<!-- ===== TRANSACTIONS ===== -->
<div id="transactions" style="display:none;">
    <div class="gas-card">
        <div class="details" style="width:100%;">
            <div class="info-box price-box">Pending Reservations</div>
            <div id="pending-list"></div>
            <div class="info-box price-box">Transaction History</div>

            <!-- Server-rendered transaction boxes removed: transaction history is managed client-side and via moved entries -->

        </div>
    </div>
</div>

<!-- ===== POSTS ===== -->
<!-- ===== POSTS ===== -->
<div id="posts"><!-- populated dynamically if profile-data contains gas info --></div>

<!-- ===== BOTTOM FIXED DASHBOARD ===== -->
<div class="bottom-dashboard">
    <div class="dash-icon" onclick="goHome()">
        <i class="fa-solid fa-house"></i><br>Home
    </div>
    <div class="dash-icon" onclick="goProfile()">
        <i class="fa-solid fa-user"></i><br>Profile
    </div>
</div>

<!-- ===== SCRIPTS ===== -->
<script>
function goHome() {
    window.location.href = "home.html";
}

function goProfile() {
    window.location.href = "profile.html";
}

function showPosts() {
    document.getElementById("posts").style.display = "block";
    document.getElementById("transactions").style.display = "none";
    document.querySelectorAll(".dash-tab")[0].classList.add("active");
    document.querySelectorAll(".dash-tab")[1].classList.remove("active");
}

function showTransactions() {
    document.getElementById("posts").style.display = "none";
    document.getElementById("transactions").style.display = "block";
    document.querySelectorAll(".dash-tab")[1].classList.add("active");
    document.querySelectorAll(".dash-tab")[0].classList.remove("active");
}

// ===== PENDING TRANSACTION TIMER & BUTTONS =====
document.addEventListener('DOMContentLoaded', function() {
    // Render pending reservations from localStorage into the Pending area
    try {
        const raw = localStorage.getItem('reservations');
        const list = raw ? JSON.parse(raw) : [];
        const pendingList = document.getElementById('pending-list');
        if (pendingList && Array.isArray(list) && list.length) {
            list.forEach(r => {
                // skip expired
                if (!r || !r.expiresAt || r.expiresAt <= Date.now()) return;
                const div = document.createElement('div');
                div.className = 'info-box';
                div.id = r.id;
                div.setAttribute('data-expires', String(r.expiresAt));
                div.setAttribute('data-reservation-id', r.id);
                div.setAttribute('data-price', String(r.price || 0));
                div.setAttribute('data-seller', String(r.seller || ''));
                div.setAttribute('data-qty', String(r.qty || 1));
                const date = new Date(r.reservedAt || Date.now()).toLocaleString();
                const safeBrand = (r.brand||'').replace(/</g,'&lt;');
                const priceText = r.price != null ? r.price : '';
                const qtyText = r.qty != null ? r.qty : '';
                div.innerHTML = `Date: ${date} | Gas: ${safeBrand} | Price: ${priceText} CFA | Qty: ${qtyText}<br>Status: <span class="status-text">Pending</span>`;
                // prepend so recent reservations appear first
                pendingList.insertBefore(div, pendingList.firstChild);
            });
        }
    } catch (e) { console.error('reservations read error', e); }

    // Transaction persistence helpers (scoped per-user)
    let __currentUser = null;
    function getCurrentUser() {
        return new Promise(resolve => {
            if (__currentUser) return resolve(__currentUser);
            // try username element first
            const el = document.querySelector('.username');
            const text = el && el.textContent ? el.textContent.trim() : '';
            if (text && text !== '{{username}}') {
                __currentUser = text;
                return resolve(__currentUser);
            }
            // fallback to /me
            fetch('/me').then(r => r.json()).then(d => {
                __currentUser = (d && d.username) ? d.username : 'anonymous';
                resolve(__currentUser);
            }).catch(() => { __currentUser = 'anonymous'; resolve(__currentUser); });
        });
    }

    function storageKeyFor(user) { return 'transactions:' + String(user || 'anon'); }
    function loadTransactionsFor(user) {
        try { return JSON.parse(localStorage.getItem(storageKeyFor(user)) || '[]'); } catch (e) { return []; }
    }
    function saveTransactionsFor(user, list) {
        try { localStorage.setItem(storageKeyFor(user), JSON.stringify(list)); } catch (e) { console.error('saveTransactions error', e); }
    }
    function addTransactionEntry(entry) {
        try {
            const user = __currentUser || 'anonymous';
            const list = loadTransactionsFor(user);
            list.unshift(entry);
            saveTransactionsFor(user, list);
            renderTransaction(entry);
        } catch (e) { console.error('addTransactionEntry error', e); }
    }
    function renderTransaction(entry) {
        const detailsEl = document.querySelector('#transactions .details');
        if (!detailsEl) return;
        const div = document.createElement('div');
        div.className = 'info-box';
        const dateText = entry.displayDate || (new Date(entry.ts || Date.now()).toLocaleString());
        const safeBrand = (entry.brand||'').replace(/</g,'&lt;');
        const statusClass = entry.type === 'collected' ? 'stock' : (entry.type === 'cancelled' ? 'out' : '');
        const statusLabel = entry.type === 'collected' ? 'Successful' : (entry.type === 'cancelled' ? 'Cancelled' : entry.type || '');
        div.innerHTML = `Date: ${dateText} | Gas: ${safeBrand} | Price: ${entry.price || ''} CFA | Qty: ${entry.qty || ''}<br>Status: <span class="status-text ${statusClass}">${statusLabel}</span>`;
        div.setAttribute('data-timestamp', String(entry.ts || Date.now()));
        detailsEl.appendChild(div);
    }

    // Render persisted transaction history for current user
    getCurrentUser().then(user => {
        const items = loadTransactionsFor(user) || [];
        if (!items.length) return;
        items.forEach(it => renderTransaction(it));
    }).catch(()=>{});

    // Setup timers for any Pending status-text using data-expires when present
    document.querySelectorAll('.status-text').forEach(statusSpan => {
        if (statusSpan.textContent.trim() === 'Pending') {
            const txDiv = statusSpan.closest('.info-box');
            if (!txDiv) return;

            // Create timer element
            const timer = document.createElement('span');
            timer.className = 'tx-timer';
            txDiv.appendChild(timer);

            // compute remaining time from data-expires attribute if present, else default 5 hours
            const expiresAttr = txDiv.getAttribute('data-expires');
            let remaining = 5 * 60 * 60 * 1000;
            if (expiresAttr) {
                const expires = parseInt(expiresAttr, 10);
                remaining = Math.max(0, expires - Date.now());
            }

            const interval = setInterval(() => {
                if (remaining <= 0) {
                    clearInterval(interval);
                    timer.textContent = 'Time expired';
                    // auto-mark expired? keep as Pending but show expired text
                    return;
                }
                let hours = Math.floor(remaining / (1000 * 60 * 60));
                let minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
                let seconds = Math.floor((remaining % (1000 * 60)) / 1000);
                timer.textContent = `${hours}h ${minutes}m ${seconds}s`;
                remaining -= 1000;
            }, 1000);

            // Create Collected button
            const collectBtn = document.createElement('button');
            collectBtn.textContent = 'Collected';
            collectBtn.className = 'edit-btn';
            collectBtn.style.padding = '4px 10px';
            collectBtn.style.marginLeft = '6px';
            collectBtn.style.backgroundColor = '#5cb85c';

            // Create Cancel button
            const cancelBtn = document.createElement('button');
            cancelBtn.textContent = 'Cancel';
            cancelBtn.className = 'edit-btn';
            cancelBtn.style.padding = '4px 10px';
            cancelBtn.style.marginLeft = '6px';
            cancelBtn.style.backgroundColor = '#d9534f';

            // helper to remove reservation from localStorage by id
            function removeReservationById(id) {
                try {
                    const raw = localStorage.getItem('reservations');
                    const list = raw ? JSON.parse(raw) : [];
                    const filtered = list.filter(x => x && x.id !== id);
                    localStorage.setItem('reservations', JSON.stringify(filtered));
                } catch (e) { console.error('remove reservation error', e); }
            }

            // Collected click logic: mark successful, persist to history and move into history
            collectBtn.addEventListener('click', function () {
                clearInterval(interval);
                // remove reservation if present
                const rid = txDiv.getAttribute('data-reservation-id');
                if (rid) removeReservationById(rid);

                // use data attributes (price and qty) when available
                const brand = txDiv.textContent.match(/Gas:\s*([^|\n]+)/i) ? (txDiv.textContent.match(/Gas:\s*([^|\n]+)/i)[1].trim()) : '';
                const price = txDiv.getAttribute('data-price') || '';
                const qty = txDiv.getAttribute('data-qty') || '';
                const collectedDate = new Date().toLocaleString();
                // replace content to reflect a completed transaction
                txDiv.innerHTML = `Date: ${collectedDate} | Gas: ${brand} | Price: ${price} CFA | Qty: ${qty}<br>Status: <span class="status-text stock">Successful</span>`;

                // remove reservation metadata
                txDiv.removeAttribute('data-expires');
                txDiv.removeAttribute('data-reservation-id');

                // persist transaction and move into the Transaction History
                const entry = { type: 'collected', brand: brand, price: price, qty: qty, seller: txDiv.getAttribute('data-seller') || '', ts: Date.now(), displayDate: collectedDate };
                addTransactionEntry(entry);
                txDiv.removeAttribute('data-expires');
                txDiv.removeAttribute('data-reservation-id');
                const detailsEl = document.querySelector('#transactions .details');
                if (detailsEl) {
                    // remove the pending element from DOM (txDiv) and let renderTransaction add a fresh copy
                    try { if (txDiv.parentNode) txDiv.parentNode.removeChild(txDiv); } catch(e){}
                }
            });

            // Cancel click logic: restore inventory via server, persist cancellation and move to history
            cancelBtn.addEventListener('click', function () {
                clearInterval(interval);
                const rid = txDiv.getAttribute('data-reservation-id');
                if (rid) removeReservationById(rid);
                const brand = txDiv.textContent.match(/Gas:\s*([^|\n]+)/i) ? (txDiv.textContent.match(/Gas:\s*([^|\n]+)/i)[1].trim()) : '';
                const price = txDiv.getAttribute('data-price') || '';
                const qty = parseInt(txDiv.getAttribute('data-qty') || '1', 10) || 1;
                const seller = txDiv.getAttribute('data-seller') || '';
                const cancelledDate = new Date().toLocaleString();

                // call server to increment seller inventory
                fetch('/increment-bottle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ seller: seller, brand: brand, qty: qty })
                }).then(async res => {
                    if (!res.ok) {
                        const body = await res.json().catch(()=>({}));
                        console.error('increment failed', body);
                    } else {
                        // notify other tabs/pages via localStorage so they can update UI
                        try {
                            const payload = { seller, brand, delta: Number(qty), ts: Date.now() };
                            localStorage.setItem('inventory-update', JSON.stringify(payload));
                        } catch (e) { /* ignore storage errors */ }

                        // update any visible cards on this page to reflect increased quantity
                        document.querySelectorAll('.gas-card').forEach(card => {
                            const nameEl = card.querySelector('.gas-name');
                            const sellerAttr = card.getAttribute('data-seller') || '';
                            if (nameEl && String(nameEl.textContent).trim().toLowerCase() === String(brand).toLowerCase() && (sellerAttr === '' || sellerAttr === seller)){
                                const availEl = card.querySelector('.available');
                                if (availEl) {
                                    const prev = parseInt(availEl.textContent || '0', 10) || 0;
                                    availEl.textContent = String(prev + qty);
                                }
                                const statusEl = card.querySelector('.stock_status');
                                if (statusEl) statusEl.textContent = 'In stock';
                            }
                        });
                    }
                }).catch(err => console.error('increment-bottle error', err)).finally(() => {
                    // persist cancelled transaction and move into history regardless of increment success
                    const entry = { type: 'cancelled', brand: brand, price: price, qty: qty, seller: seller, ts: Date.now(), displayDate: cancelledDate };
                    addTransactionEntry(entry);
                    // remove pending element from DOM
                    try { if (txDiv.parentNode) txDiv.parentNode.removeChild(txDiv); } catch(e){}
                });
            });

            // Append buttons to transaction
            txDiv.appendChild(collectBtn);
            txDiv.appendChild(cancelBtn);
        }
    });
    // Transaction history pruning removed to keep history visible permanently
});
</script>

<script>
// populate username from cookie (set at signup/login)
(function(){
    // Prefer server-provided /me (works if cookie is HTTP-only); fallback to document.cookie
    function setName(uname){
        if (!uname) return;
        const el = document.querySelector('.username');
        if (el) el.textContent = uname;
        try{ document.title = 'Gas Profile - ' + uname; }catch(e){}
    }

    fetch('/profile-data').then(r => r.json()).then(data => {
        if (!data) return;
        if (data.name) setName(data.name);
        // show profile image if available
        if (data.profileImage) {
            const av = document.querySelector('.avatar');
            if (av) {
                av.innerHTML = '';
                const img = document.createElement('img');
                img.src = data.profileImage;
                img.alt = 'Profile picture';
                av.appendChild(img);
            }
        }

        const posts = document.getElementById('posts');
        const bottles = Array.isArray(data.bottles) ? data.bottles : [];
        if (!bottles.length) {
            posts.innerHTML = '';
            return;
        }

        const cards = bottles.map(b => {
            const brand = (b.brand || '').replace(/</g,'&lt;');
            const rawBrand = (b.brand || '').replace(/"/g,'&quot;');
            const qty = b.quantity != null ? b.quantity : 0;
            const price = b.price != null ? b.price : 0;
            const stock_status = qty > 0 ? 'In stock' : 'Out of stock';
            return `
            <div class="gas-card">
                <div class="gas-bottle gaz">
                    <img data-brand="${rawBrand}" src="images/gas-placeholder.png" alt="${brand}">
                    <div class="gas-name">${brand}</div>
                </div>
                <div class="details">
                    <div class="info-box">Available: <span class="available">${qty}</span></div>
                    <div class="info-box price-box">Price: <span class="price">${price}</span> CFA</div>
                    <!-- Quarter box removed -->
                    <div class="info-box stock-status-box"><span class="stock_status">${stock_status}</span></div>
                    <div style="margin-top:8px">
                        <button class="delete-btn" data-brand="${rawBrand}" style="background:#e74c3c;color:white;border:none;padding:6px 10px;border-radius:6px;cursor:pointer;">Delete</button>
                    </div>
                </div>
            </div>`;
        }).join('\n');

        posts.innerHTML = cards;

        // Attempt to load brand-specific bottle images. Try several filename variants and fall back to placeholder.
        (function loadBottleImages(){
            const placeholdersrc = 'images/gas-placeholder.png';
            const exts = ['.jpeg', '.jpg', '.png'];
            function variants(name){
                if(!name) return [];
                const v = [];
                const cleaned = name.trim();
                const words = cleaned.split(/\s+/);
                // original
                v.push(cleaned);
                // joined
                v.push(words.join(''));
                // lowercase
                v.push(cleaned.toLowerCase());
                v.push(words.join('').toLowerCase());
                // capitalize each word
                v.push(words.map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(''));
                return Array.from(new Set(v)).filter(Boolean);
            }

            document.querySelectorAll('.gas-bottle img[data-brand]').forEach(img => {
                const brand = img.getAttribute('data-brand') || '';
                const tries = [];
                variants(brand).forEach(base => exts.forEach(ext => tries.push('images/' + base + ext)));

                // try candidates sequentially using onerror fallback
                let i = 0;
                function tryNext(){
                    if(i >= tries.length){
                        img.src = placeholdersrc;
                        return;
                    }
                    const candidate = tries[i++];
                    const tester = new Image();
                    tester.onload = function(){ img.src = candidate; };
                    tester.onerror = tryNext;
                    tester.src = candidate;
                }
                tryNext();
            });
        })();

        // Attach delete handler via event delegation
        posts.addEventListener('click', async function (ev) {
            const btn = ev.target.closest('.delete-btn');
            if (!btn) return;
            const brand = btn.getAttribute('data-brand') || '';
            if (!brand) { alert('Missing brand'); return; }
            if (!confirm(`Delete ${brand}?`)) return;
            btn.disabled = true;
            try {
                const res = await fetch('/delete-bottle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ brand })
                });
                const body = await res.json().catch(()=>({}));
                if (!res.ok) {
                    alert(body.error || 'Failed to delete');
                    btn.disabled = false;
                    return;
                }
                // remove card from DOM
                const card = btn.closest('.gas-card');
                if (card) card.remove();
            } catch (err) {
                console.error(err);
                alert('Error deleting. See console.');
                btn.disabled = false;
            }
        });
    }).catch(() => {
        // fallback to /me
        fetch('/me').then(r=>r.json()).then(d=>{ if (d && d.username) setName(d.username); });
    });
})();
</script>

</body>
</html>
