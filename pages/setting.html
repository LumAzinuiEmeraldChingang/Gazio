<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings Page</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #4ef0f0;
  }

  .back-arrow {
    position: fixed;
    top: 20px;
    left: 20px;
    font-size: 28px;
    cursor: pointer;
    color: #333;
    transition: color 0.2s;
    z-index: 1000;
  }
  .back-arrow:hover { color: #000; }

  .settings-container {
    max-width: 400px;
    margin: 80px auto 20px;
    padding: 20px;
    background-color: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  h2 { text-align: center; margin-bottom: 20px; }

  /* Profile picture upload */
  .profile-pic-area { text-align: center; margin-bottom: 16px; }
  .profile-pic-label { position: relative; display: inline-block; cursor: pointer; }
  .profile-pic-label img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #eee; background: #fafafa; display: block; }
  .camera-overlay { position: absolute; right: -4px; bottom: -4px; background: rgba(0,0,0,0.6); color: #fff; border-radius: 50%; padding: 8px; font-size: 16px; }
  /* Phone card (Cameroon) */
  .phone-card { background: #fbfbfb; border: 1px solid #e6e6e6; padding: 10px; border-radius: 8px; margin: 8px 0 14px; }
  .phone-card label { display: block; margin-bottom: 6px; font-weight: 600; }
  .phone-input-row { display: flex; gap: 8px; align-items: center; }
  .phone-input-row .country { background: #fff; border: 1px solid #ddd; padding: 8px 10px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  #phoneNumber { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
  .phone-error { color: #b00020; font-size: 13px; margin-top: 6px; display: none; }

  input {
    width: 100%;
    padding: 10px;
    margin: 12px 0;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
  }

  button, .logout {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    font-size: 16px;
    cursor: pointer;
    border-radius: 6px;
    border: none;
  }
  button { background-color: #4CAF50; color: white; }
  .logout { background-color: red; color: white; }

  #status { text-align: center; margin-top: 15px; font-weight: bold; color: green; }

  /* Password strength */
  .strength-bar {
    height: 8px;
    width: 100%;
    background-color: #eee;
    border-radius: 4px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .strength-fill {
    height: 100%;
    width: 0%;
    background-color: red;
    border-radius: 4px;
    transition: width 0.3s ease, background-color 0.3s ease;
  }
  .strength-text { font-size: 14px; margin-bottom: 10px; }

  @media (max-width: 500px) {
    .settings-container { margin: 60px 20px; padding: 15px; }
    input, button, .logout { font-size: 14px; padding: 10px; }
    .back-arrow { font-size: 24px; top: 15px; left: 15px; }
  }
</style>
</head>
<body>

<a class="back-arrow" onclick="goBack()">←</a>

<div class="settings-container">
  <h2>Account Settings</h2>
  
  <!-- Profile picture upload area -->
  <div class="profile-pic-area">
    <label for="profileInput" class="profile-pic-label" title="Upload profile picture">
      <img id="profilePreview" src="" alt="Profile picture" />
      <div class="camera-overlay">📷</div>
    </label>
    <input type="file" id="profileInput" accept="image/*">
  </div>
  
  <label>Username</label>
  <input type="text" id="username" placeholder="New username">
  
  <label>Email</label>
  <input type="email" id="email" placeholder="New email">
  
  <!-- Cameroon phone card -->
  <div class="phone-card">
    <label for="phoneNumber">Phone (Cameroon, +237)</label>
    <div class="phone-input-row">
      <div class="country">🇨🇲 +237</div>
      <input type="tel" id="phoneNumber" placeholder="6XXXXXXXX" maxlength="9" inputmode="numeric">
    </div>
    <div id="phoneError" class="phone-error">Please enter a valid Cameroon number (8 or 9 digits).</div>
  </div>

  <!-- Location -->
  <label for="location">Location</label>
  <input type="text" id="location" placeholder="City, Region (e.g., Douala)" maxlength="100">
  
  <label>Password</label>
  <input type="password" id="password" placeholder="New password" oninput="checkPasswordStrength()">
  
  <!-- Password strength meter -->
  <div class="strength-bar">
    <div class="strength-fill" id="strengthFill"></div>
  </div>
  <div class="strength-text" id="strengthText"></div>
  
  <button onclick="updateSettings()">Save Changes</button>
  <button class="logout" onclick="logout()">Log Out</button>
  
  <p id="status"></p>
</div>

<script>
function goBack() { window.history.back(); }

function checkPasswordStrength() {
    const password = document.getElementById('password').value;
    const fill = document.getElementById('strengthFill');
    const text = document.getElementById('strengthText');

    let strength = 0;

    if (password.length >= 6) strength++; // length
    if (password.match(/[A-Z]/)) strength++; // uppercase
    if (password.match(/[0-9]/)) strength++; // number
    if (password.match(/[\W_]/)) strength++; // special character

    // Update strength bar
    switch(strength) {
        case 0:
        case 1:
            fill.style.width = "25%";
            fill.style.backgroundColor = "red";
            text.innerText = "Weak";
            break;
        case 2:
            fill.style.width = "50%";
            fill.style.backgroundColor = "orange";
            text.innerText = "Medium";
            break;
        case 3:
            fill.style.width = "75%";
            fill.style.backgroundColor = "yellowgreen";
            text.innerText = "Strong";
            break;
        case 4:
            fill.style.width = "100%";
            fill.style.backgroundColor = "green";
            text.innerText = "Very Strong";
            break;
    }
}

async function updateSettings() {
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
  // include profile image if selected (data URL)
  const profileImg = document.getElementById('profilePreview').src || null;

    // phone (Cameroon). Input only holds national number (digits after +237)
    const phoneField = document.getElementById('phoneNumber');
    const rawPhone = (phoneField && phoneField.value) ? phoneField.value.replace(/\D/g, '') : '';
    const location = (document.getElementById('location') && document.getElementById('location').value) ? document.getElementById('location').value.trim() : null;
    const phoneErrorEl = document.getElementById('phoneError');
    if (rawPhone && !validateCameroonNumber(rawPhone)) {
      phoneErrorEl.style.display = 'block';
      phoneErrorEl.innerText = 'Please enter 8 or 9 digits for a Cameroon number.';
      return;
    } else if (phoneErrorEl) {
      phoneErrorEl.style.display = rawPhone ? 'none' : 'none';
    }

    const response = await fetch('/api/settings', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password, profileImage: profileImg, phone: rawPhone ? '+237' + rawPhone : null, location: location })
    });

    const result = await response.json();
    document.getElementById('status').innerText = result.message;
}

// Profile image preview handling
document.getElementById('profileInput').addEventListener('change', function(e) {
  const file = this.files && this.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = document.getElementById('profilePreview');
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

async function logout() {
    const confirmLogout = confirm("Are you sure you want to log out?");
    if (!confirmLogout) return;

    window.location.href = "Login.html";
}
</script>
</body>
</html>
